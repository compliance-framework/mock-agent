name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    uses: compliance-framework/workflows/.github/workflows/release-go-image.yml@55c549bf712163152173b398e297fba0f907ceca # v1.4.0
    with:
      images: >-
        [{"name": "mock-agent", "dockerfile": "Dockerfile", "context": "."},
         {"name": "mock-agent-ci", "dockerfile": "Dockerfile-ci", "context": "."},
         {"name": "mock-agent-custodian", "dockerfile": "Dockerfile-custodian", "context": "."}]
    permissions:
      contents: read
      packages: write
    secrets: inherit
